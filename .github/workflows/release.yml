# Builds Snugfit and its installer on Windows, and attaches the installer to a
# GitHub Release. Runs when a version tag (like v1.1.0) is pushed, or when you
# click "Run workflow" on the Actions tab (it then creates the tag v<Version>
# from version.go for you).
# The in-app updater looks for an asset named Snugfit-Setup-<version>.exe.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      GOPROXY: direct
      GOSUMDB: "off"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Install NSIS
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) {
            choco install nsis -y --no-progress
          }
          "C:\Program Files (x86)\NSIS" | Out-File -FilePath $env:GITHUB_PATH -Append

      - name: Build app and installer
        shell: bash
        run: ./build.sh

      - name: Read version
        id: ver
        shell: bash
        run: echo "version=$(grep -oE 'Version = \"[0-9.]+\"' version.go | grep -oE '[0-9.]+')" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Snugfit-Setup-${{ steps.ver.outputs.version }}
          path: dist/Snugfit-Setup-*.exe

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          name: Snugfit ${{ steps.ver.outputs.version }}
          body_path: dist/RELEASE_NOTES.md
          files: dist/Snugfit-Setup-*.exe
